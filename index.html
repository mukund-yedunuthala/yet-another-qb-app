<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yet Another Question Bank App</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- Oat CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@knadh/oat@latest/oat.min.js" defer></script>
    
    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@latest/dist/iife/sdk.min.js"></script>
    
    <!-- Navigo Router -->
    <script src="https://unpkg.com/navigo@latest"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <a href="/" data-navigo><strong>Yet Another Question Bank App</strong></a>
        </div>
        <div class="right-section">
            <nav>
                <a href="/create" data-navigo class="nav-link">Add question</a>
                <a href="/flashcards" data-navigo class="nav-link">Flashcards</a>
                <a href="/questions" data-navigo class="nav-link">Questions</a>
            </nav>
            <label>
                Dark
                <input type="checkbox" role="switch" id="theme-switch" checked>
            </label>
        </div>
    </header>

    <main id="app-content">
        <!-- Content will be dynamically loaded here -->
    </main>

    <footer>
        <p>&copy; 2026 Yet Another Question Bank App. Built with Oat and Appwrite. Version: 2.0.2</p>
        <nav>
            <a href="/imprint" data-navigo class="nav-link">Imprint</a>
            <a href="/privacy" data-navigo class="nav-link">Privacy Policy</a>
            <a href="/about" data-navigo class="nav-link">About</a>
        </nav>
    </footer>

    <!-- Load scripts as modules -->
    <script type="module" src="js/router.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
