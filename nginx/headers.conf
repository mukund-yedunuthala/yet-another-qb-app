server {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdn.jsdelivr.net unpkg.com 'unsafe-inline'; style-src 'self' cdn.jsdelivr.net; connect-src 'self' https://fra.cloud.appwrite.io; img-src 'self' data:; font-src 'self' cdn.jsdelivr.net; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
